name: Test

on:
  push:
    branches: ["main", "acme-tls", "whitelists"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python source
        run: python -m compileall -q app tests

      - name: Validate Docker Compose
        run: docker compose config >/dev/null

      - name: Validate bootstrap Caddy JSON
        run: docker run --rm -v "$PWD/caddy/caddy.bootstrap.json:/etc/caddy/caddy.json:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/caddy.json

      - name: Render managed Caddy JSON fixtures
        env:
          DATA_DIR: ${{ runner.temp }}/caddy-fixture-data
        run: python tools/render_caddy_validation_fixtures.py "${{ runner.temp }}/caddy-fixtures"

      - name: Validate managed Caddy JSON
        run: |
          for mode in http upload acme; do
            docker run --rm \
              -v "${{ runner.temp }}/caddy-fixtures:/configs:ro" \
              -v "${{ runner.temp }}/caddy-fixtures/tls:/blockinator-tls:ro" \
              caddy:2.11.4-alpine \
              caddy validate --config "/configs/${mode}.json"
          done

      - name: Build Blockinator Docker image
        run: docker compose build blockinator

      - name: Run tests
        env:
          DATA_DIR: ${{ runner.temp }}/blockinator-data
          ADMIN_PASSWORD: test-admin-password
          POLICY_API_KEY: test-policy-api-key-long-enough
        run: python -m pytest -q

      - name: Start benchmark stack
        env:
          ADMIN_PASSWORD: test-admin-password
          POLICY_API_KEY: test-policy-api-key-long-enough
        run: docker compose up -d --wait

      - name: Benchmark direct vs Caddy policy latency
        env:
          ADMIN_PASSWORD: test-admin-password
          POLICY_API_KEY: test-policy-api-key-long-enough
        run: |
          docker compose exec -T blockinator \
            python /srv/tools/benchmark_policy_latency.py \
            --requests 50 --warmup 10

      - name: Stop benchmark stack
        if: always()
        run: docker compose down -v

  mysql-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: blockinator_test
          MYSQL_USER: blockinator
          MYSQL_PASSWORD: blockinator-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python source
        run: python -m compileall -q app tests

      - name: Run MySQL integration tests
        env:
          MYSQL_TEST: "1"
          DATABASE_BACKEND: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: blockinator_test
          MYSQL_USER: blockinator
          MYSQL_PASSWORD: blockinator-test-password
          MYSQL_SSL_ENABLED: "0"
          ADMIN_PASSWORD: test-admin-password
          POLICY_API_KEY: test-policy-api-key-long-enough
          TZ: UTC
        run: python -m pytest -q tests/test_mysql_backend.py

