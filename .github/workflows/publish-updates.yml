name: Publish update channel
on:
  push:
    branches: [release, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/preview'
    uses: ./.github/workflows/test.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release contract
        id: contract
        run: |
          python - <<'PY'
          import json, os
          from app.version import APP_VERSION, SCHEMA_VERSION, UPDATER_PROTOCOL
          r = json.load(open('updater/release.json'))
          assert r['version'] == APP_VERSION
          assert r['schema'] == SCHEMA_VERSION and r['protocol'] == UPDATER_PROTOCOL
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('version', 'schema'):
                  out.write(f'{key}={r[key]}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stealthcat/blockinator-web:${{ github.ref_name }}-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.contract.outputs.version }}
            SCHEMA_VERSION=${{ steps.contract.outputs.schema }}
            BUILD_SHA=${{ github.sha }}
            BUILD_CHANNEL=${{ github.ref_name }}
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/stealthcat/blockinator-web
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create immutable release identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open('updater/release.json'))
          r.update(channel=os.environ['GITHUB_REF_NAME'], sha=os.environ['GITHUB_SHA'],
                   digest=os.environ['IMAGE_DIGEST'], sequence=int(os.environ['GITHUB_RUN_NUMBER']))
          with open('manifest.json', 'w') as out:
              json.dump(r, out, sort_keys=True)
          PY
      - uses: actions/attest@v4
        with:
          subject-path: manifest.json
      - name: Publish channel discovery metadata after verification artifacts exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ github.ref_name }}
        run: |
          if ! gh release view "updates-$CHANNEL" >/dev/null 2>&1; then
            gh release create "updates-$CHANNEL" --target "$GITHUB_SHA" --title "Blockinator $CHANNEL channel" --notes "Verified Docker update channel. See the manifest for the exact build." --prerelease --latest=false
          fi
          gh release upload "updates-$CHANNEL" manifest.json --clobber
