services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: blockinator-caddy
    restart: unless-stopped
    user: "0:0"
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    ports:
      - "${POLICY_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./caddy/caddy.bootstrap.json:/etc/caddy/caddy.json:ro
      - ./data/tls:/blockinator-tls:ro
      - ./data/caddy:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/apps/http/servers >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 2s
      retries: 3

  blockinator:
    build: .
    container_name: blockinator
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-this-admin-password}"
      POLICY_API_KEY: "${POLICY_API_KEY:-change-this-long-random-api-key}"
      DATABASE_BACKEND: "${DATABASE_BACKEND:-sqlite}"
      MYSQL_HOST: "${MYSQL_HOST:-}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-blockinator}"
      MYSQL_USER: "${MYSQL_USER:-blockinator}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
      MYSQL_CONNECT_TIMEOUT: "${MYSQL_CONNECT_TIMEOUT:-10}"
      MYSQL_POOL_SIZE: "${MYSQL_POOL_SIZE:-10}"
      MYSQL_POOL_TIMEOUT_SECONDS: "${MYSQL_POOL_TIMEOUT_SECONDS:-5}"
      MYSQL_POOL_RECYCLE_SECONDS: "${MYSQL_POOL_RECYCLE_SECONDS:-300}"
      MYSQL_SSL_ENABLED: "${MYSQL_SSL_ENABLED:-0}"
      MYSQL_SSL_CA: "${MYSQL_SSL_CA:-}"
      MYSQL_SSL_CERT: "${MYSQL_SSL_CERT:-}"
      MYSQL_SSL_KEY: "${MYSQL_SSL_KEY:-}"
      MYSQL_SSL_VERIFY_CERT: "${MYSQL_SSL_VERIFY_CERT:-1}"
      MAX_BLOCKLIST_BYTES: "${MAX_BLOCKLIST_BYTES:-104857600}"
      BLOCKLIST_REFRESH_POLL_SECONDS: "${BLOCKLIST_REFRESH_POLL_SECONDS:-30}"
      BLOCKLIST_REFRESH_WORKERS: "${BLOCKLIST_REFRESH_WORKERS:-4}"
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-0}"
      ADMIN_SESSION_TTL_SECONDS: "${ADMIN_SESSION_TTL_SECONDS:-43200}"
      TZ: "${TZ:-UTC}"
      RDNS_NAMESERVERS: "${RDNS_NAMESERVERS:-}"
      RDNS_TIMEOUT_SECONDS: "${RDNS_TIMEOUT_SECONDS:-0.5}"
      RDNS_PAGE_BUDGET_SECONDS: "${RDNS_PAGE_BUDGET_SECONDS:-1.25}"
      RDNS_CACHE_TTL_SECONDS: "${RDNS_CACHE_TTL_SECONDS:-300}"
      RDNS_NEGATIVE_TTL_SECONDS: "${RDNS_NEGATIVE_TTL_SECONDS:-60}"
      RDNS_WORKERS: "${RDNS_WORKERS:-12}"
      RDNS_RESOLVER_WORKERS: "${RDNS_RESOLVER_WORKERS:-8}"
      RDNS_RESOLVED_REFRESH_SECONDS: "${RDNS_RESOLVED_REFRESH_SECONDS:-86400}"
      RDNS_NO_PTR_REFRESH_SECONDS: "${RDNS_NO_PTR_REFRESH_SECONDS:-21600}"
      RDNS_RECONCILE_SECONDS: "${RDNS_RECONCILE_SECONDS:-1}"
      CADDY_ADMIN_URL: "http://caddy:2019"
      TLS_RECONCILE_SECONDS: "${TLS_RECONCILE_SECONDS:-30}"
      DATA_DIR: /data
    volumes:
      - ./data:/data
